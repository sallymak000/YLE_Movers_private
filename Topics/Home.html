<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambridge Movers - Vocabulary Quiz</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;700&display=swap');

        * { box-sizing: border-box; font-family: 'Quicksand', sans-serif; -webkit-user-select: none; user-select: none; }
        body { margin: 0; padding: 0; background-color: #f0f7f4; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #333; }
        .game-container { width: 100%; max-width: 600px; background: #ffffff; border-radius: 24px; box-shadow: 0 12px 30px rgba(0,0,0,0.08); border: 6px solid #bce1cd; padding: 24px; text-align: center; position: relative; overflow: hidden; margin: 15px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .level-badge { font-family: 'Fredoka One', cursive; background-color: #ff9f43; color: white; padding: 6px 16px; border-radius: 50px; font-size: 14pt; box-shadow: 0 4px 0 #d35400; }
        .progress-container { display: flex; align-items: center; gap: 10px; font-weight: 700; color: #555; }
        .progress-bar-bg { width: 120px; height: 14px; background-color: #e2ecc8; border-radius: 10px; overflow: hidden; border: 2px solid #ccd9aa; }
        .progress-bar-fill { height: 100%; width: 0%; background-color: #2ed573; transition: width 0.3s ease; }
        .target-word-box { display: none; } /* 隱藏文字提示 */
        .image-viewport { width: 100%; height: 240px; background-color: #fbfbfc; border: 4px solid #dfe6e9; border-radius: 20px; display: flex; justify-content: center; align-items: center; margin: 10px 0 25px 0; position: relative; overflow: hidden; box-shadow: inset 0 4px 10px rgba(0,0,0,0.02); padding: 10px; }
        .image-viewport img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 12px; }
        .options-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 15px; }
        .btn-option { background-color: #ffffff; border: 3px solid #dfe6e9; border-bottom: 7px solid #dfe6e9; border-radius: 16px; padding: 14px 20px; font-size: 16pt; font-weight: 700; color: #2d3436; cursor: pointer; transition: all 0.1s ease; outline: none; }
        .btn-option:hover { background-color: #f9f9f9; border-color: #b2bec3; }
        .btn-option:active { transform: translateY(4px); border-bottom-width: 3px; }
        .btn-option.correct { background-color: #2ed573 !important; border-color: #26af5f !important; border-bottom-color: #1b8a47 !important; color: white !important; }
        .btn-option.wrong { background-color: #ff4757 !important; border-color: #ff2238 !important; border-bottom-color: #b31020 !important; color: white !important; }
        .overlay-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(255, 255, 255, 0.98); display: none; flex-direction: column; justify-content: center; align-items: center; padding: 30px; z-index: 10; }
        .overlay-score { font-size: 40pt; font-weight: 700; color: #2ed573; margin-bottom: 30px; }
        .btn-restart { font-family: 'Fredoka One', cursive; background-color: #2ed573; color: white; border: none; border-bottom: 6px solid #1b8a47; padding: 14px 40px; font-size: 18pt; border-radius: 50px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="header">
            <span class="level-badge">Movers</span>
            <div class="progress-container">
                <div class="progress-bar-bg"><div id="progressBar" class="progress-bar-fill"></div></div>
                <span id="progressText">1/19</span>
            </div>
        </div>

        <div class="target-word-box"><h2 id="targetWord" class="target-word"></h2></div>
        <div class="image-viewport" id="imageViewport"></div>
        <div class="options-grid" id="optionsContainer"></div>

        <div class="overlay-screen" id="endScreen">
            <h2 class="overlay-title">Well Done! 🎉</h2>
            <div class="overlay-score" id="finalScore">19 / 19</div>
            <button class="btn-restart" onclick="restartQuiz()">Play Again</button>
        </div>
    </div>

    <script>
        const vocabulary = [
            { word: "address", options: ["address", "message", "internet"] },
            { word: "balcony", options: ["balcony", "roof", "floor"] },
            { word: "basement", options: ["basement", "floor", "roof"] },
            { word: "blanket", options: ["blanket", "towel", "shower"] },
            { word: "lift", options: ["lift", "stairs", "model"] },
            { word: "floor", options: ["floor", "basement", "roof"] },
            { word: "internet", options: ["internet", "message", "address"] },
            { word: "message", options: ["message", "internet", "address"] },
            { word: "model", options: ["model", "dream", "wash"] },
            { word: "roof", options: ["roof", "balcony", "floor"] },
            { word: "shower", options: ["shower", "wash", "towel"] },
            { word: "toothbrush", options: ["toothbrush", "toothpaste", "towel"] },
            { word: "toothpaste", options: ["toothpaste", "toothbrush", "wash"] },
            { word: "towel", options: ["towel", "blanket", "shower"] },
            { word: "dream", options: ["dream", "model", "wash"] },
            { word: "wash", options: ["wash", "shower", "dream"] },
            { word: "stairs", options: ["stairs", "lift", "upstairs"] },
            { word: "downstairs", options: ["downstairs", "upstairs", "basement"] },
            { word: "upstairs", options: ["upstairs", "downstairs", "roof"] }
        ];

        let currentIndex = 0, score = 0, hasAnswered = false;

        function loadQuestion() {
            hasAnswered = false;
            const currentItem = vocabulary[currentIndex];
            document.getElementById("progressText").textContent = `${currentIndex + 1} / ${vocabulary.length}`;
            document.getElementById("progressBar").style.width = `${(currentIndex / vocabulary.length) * 100}%`;
            document.getElementById("targetWord").textContent = currentItem.word;
            
            const viewport = document.getElementById("imageViewport");
            viewport.innerHTML = `<img src="images/${currentItem.word}.png" alt="${currentItem.word}" onerror="this.style.display='none'; this.parentNode.innerHTML='<div style=\'color:#aaa;\'>Image Not Found</div>'">`;
            
            const optionsContainer = document.getElementById("optionsContainer");
            optionsContainer.innerHTML = "";
            [...currentItem.options].sort(() => Math.random() - 0.5).forEach(opt => {
                const btn = document.createElement("button");
                btn.className = "btn-option";
                btn.textContent = opt;
                btn.onclick = () => checkAnswer(btn, opt);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(btn, chosen) {
            if (hasAnswered) return;
            hasAnswered = true;
            if (chosen === vocabulary[currentIndex].word) {
                btn.classList.add("correct");
                score++;
            } else {
                btn.classList.add("wrong");
                document.querySelectorAll(".btn-option").forEach(b => { if(b.textContent === vocabulary[currentIndex].word) b.classList.add("correct"); });
            }
            setTimeout(() => { if (++currentIndex < vocabulary.length) loadQuestion(); else document.getElementById("endScreen").style.display = "flex"; }, 1500);
        }

        function restartQuiz() {
            currentIndex = 0; score = 0;
            document.getElementById("endScreen").style.display = "none";
            vocabulary.sort(() => Math.random() - 0.5);
            loadQuestion();
        }

        window.onload = () => { vocabulary.sort(() => Math.random() - 0.5); loadQuestion(); };
    </script>
</body>
</html>
